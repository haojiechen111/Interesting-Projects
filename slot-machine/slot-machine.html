/* 像素哨站：保留响应式结构，将功能控件统一成硬边仪表。 */
:root{--ink:#151f22;--plate:#273638;--edge:#566461;--amber:#efc078}
body{background-color:#151f22;background-image:linear-gradient(90deg,#1c282b 50%,transparent 50%),linear-gradient(#1c282b 50%,transparent 50%);background-size:8px 8px,8px 8px;background-position:0 0,4px 4px;color:#dfdfcb;font-family:"Zpix","Fusion Pixel 12px Proportional SC","Ark Pixel 12px Proportional zh_cn","Press Start 2P","Noto Sans Mono CJK SC",monospace;font-synthesis:none;-webkit-font-smoothing:none;text-rendering:optimizeSpeed}
.brand-mark,.currencies span,.machine,.marquee,.screen,.column-shift,.field-panel,.battle-button,.battle-button::before,.combat-hud span,.combat-result b,.reserve-pager button,.reserve .person,.modal,.compass-modal button:not(.modal-close),.compass-legend span,.compass-legend i{border-radius:0}
.brand-mark{transform:none;background:#334844;color:var(--amber);box-shadow:3px 3px #0e1618}.currencies span{background:#263537}.machine{background:#3b4b49;border-color:#67756a;box-shadow:inset 0 3px #51615b,4px 4px #10191b}.status{color:#e1dfc4}.column-shift{background:#c0a271;color:#241f18}.field-panel,.reserve-panel{background:var(--plate)}.scene{background:#344345;border-color:#53615c}.scenery{filter:none}.scene::before,.scene::after{background:none}.character,.equipment,.rank-dial{shape-rendering:crispEdges}.combat-fx,.compass-sparks{image-rendering:pixelated}.combat-hud span,.combat-result b,.modal{background:#202e31;box-shadow:4px 4px #10181b}.combat-result,.compass-modal::backdrop{backdrop-filter:none}.reserve .person{background:#34484a;box-shadow:2px 2px #161f21}.reserve .person:hover{background:#42585a}
.battle-button{background:#d6ad69;color:#242b24;box-shadow:0 3px #111a1b,inset 0 -3px #a9804b}.battle-button[aria-pressed="true"]{background:#405a52}.battle-button:disabled{background:#344646}.battle-button::after{content:none}.battle-emblem{border-radius:0;background:none;border:2px solid currentColor}.battle-chevron{transform:none;border:0;background:currentColor;clip-path:polygon(0 0,50% 0,50% 25%,75% 25%,75% 50%,100% 50%,100% 75%,75% 75%,75% 100%,0 100%)}
.compass-shell{background:#7c684c;box-shadow:0 0 0 4px #121b1e,inset 0 0 0 3px #c49d65}.compass-shell::after{background:none;box-shadow:inset 0 0 0 2px #cdb381}.compass-pointer{background:var(--amber);clip-path:polygon(0 0,100% 0,100% 42%,78% 42%,78% 65%,65% 65%,65% 85%,55% 85%,55% 100%,45% 100%,45% 85%,35% 85%,35% 65%,22% 65%,22% 42%,0 42%)}.compass-hub{border-radius:0;background:#2d403f;color:var(--amber);box-shadow:3px 3px #141d20}.compass-hub svg,.brand-mark svg{width:55%;height:55%}
/* 08b · 像素收尾：消除残留渐变、柔光与圆角 */
.cell{background:#cfd6b4;box-shadow:inset 3px 3px #eef2d6,inset -3px -3px #8a9a8c}.cell::before{content:none}.cell .equipment{width:92%;height:92%;filter:none;image-rendering:pixelated}
.lever-ball{border-radius:0;background:#d8603c;box-shadow:3px 3px #233c38,inset 3px 3px #f09a6a,inset -3px -3px #8b342a}.lever-base,.lever-arm{border-radius:0}
.person[data-rank="2"] .character,.person[data-rank="3"] .character,.person[data-rank="4"] .character{filter:none}
.person[data-rank="2"]{box-shadow:0 0 0 2px #efb936}.person[data-rank="3"]{box-shadow:0 0 0 2px #5bdce6}.person[data-rank="4"]{box-shadow:0 0 0 2px #bb80ff}

.compass-legend i{border-radius:0;box-shadow:none}.compass-shell,.compass-wheel,.compass-shell::after{border-radius:50%}

/* 08c · 灵动层：顿帧滚动、落定回弹、中奖定格 */
@keyframes cell-flash{0%{box-shadow:inset 0 0 0 4px #fff8dd}45%{box-shadow:inset 0 0 0 2px #ffd978,inset 3px 3px #eef2d6,inset -3px -3px #8a9a8c}100%{box-shadow:inset 3px 3px #eef2d6,inset -3px -3px #8a9a8c}}
@keyframes reel-lightbar{0%{opacity:1}50%{opacity:.25}100%{opacity:0}}
@keyframes hit-pop{0%{transform:translateY(0)}30%{transform:translateY(-6px)}60%{transform:translateY(2px)}100%{transform:translateY(0)}}
@keyframes burst-in{0%{transform:translate(-50%,6px);opacity:0}45%{transform:translate(-50%,-4px);opacity:1}100%{transform:translate(-50%,0);opacity:1}}
@keyframes ball-hint{0%{transform:translateY(0)}50%{transform:translateY(2px)}100%{transform:translateY(0)}}
@keyframes machine-idle{0%{transform:translate(0,0)}50%{transform:translate(1px,-1px)}100%{transform:translate(0,0)}}
#reels{position:relative}
.reel.landed{position:relative}
.reel.landed::after{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:#fff8dd;pointer-events:none;z-index:4;animation:reel-lightbar .3s steps(3,end) forwards}
.reel.landed .cell{animation:cell-flash .22s steps(3,end)}
.reel.landed .cell:nth-child(2){animation-delay:.05s}
.reel.landed .cell:nth-child(3){animation-delay:.1s}
.reel.spinning .cell{animation:roll .09s steps(2,end) infinite;filter:none}
#reels.settling .cell:not(.hit){opacity:.3}
#reels.settling .cell.hit{animation:hit-pop .34s steps(4,end) 2,win-flash .7s steps(2,end) .68s infinite}
#reels.settling .reel:nth-child(2) .cell.hit{animation-delay:.09s,.77s}
#reels.settling .reel:nth-child(3) .cell.hit{animation-delay:.18s,.86s}
.win-burst{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:6;padding:5px 10px;background:#ffe9a2;color:#8d3b1d;font-size:11px;font-weight:700;letter-spacing:1px;white-space:nowrap;pointer-events:none;box-shadow:3px 3px #233c38,inset 2px 2px #fff8dd,inset -2px -2px #d99a34;animation:burst-in .24s steps(4,end)}
.screen{animation:machine-idle 5s steps(2,end) infinite}
.screen:has(.reel.spinning),.screen:has(#reels.settling),.screen:has(.reel.landed){animation:none}
#lever:not(:disabled) .lever-ball{animation:ball-hint 1.9s steps(2,end) infinite}
#lever:disabled .lever-ball{animation:none}

.machine{padding:7px 7px 14px;border:0;border-radius:0;background:#4a5a52;box-shadow:0 0 0 3px #10191b,inset 0 4px #6d7f74,inset 0 -6px #2b3832,6px 6px #10191b}

.marquee{position:relative;display:flex;align-items:center;justify-content:center;gap:9px;margin:0 0 12px;padding:9px 14px 11px;border:0;background:linear-gradient(#2f8a7c,#1d6054);box-shadow:inset 0 3px #57b49f,inset 0 -4px #12433b;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 100%,0 100%);color:#fff5da}
.marquee-title{font-size:15px;letter-spacing:4px}
.marquee-bolt{width:7px;height:7px;background:#efbb55;box-shadow:inset -2px -2px #a87b2c,0 0 6px #ffd66f}
.marquee::after{content:'';position:absolute;left:12px;right:12px;bottom:2px;height:3px;background:repeating-linear-gradient(90deg,#ffd978 0 3px,transparent 3px 9px);animation:bulb-chase 1.1s steps(3,end) infinite}
@keyframes bulb-chase{to{background-position:9px 0}}
.skull-mascot{flex:none;width:26px;height:26px;image-rendering:pixelated}
.skull-eye{transform-box:fill-box;transform-origin:center;animation:skull-blink 4.4s steps(1,end) infinite}
@keyframes skull-blink{0%,90%{transform:scaleY(1)}92%,95%{transform:scaleY(.15)}97%,100%{transform:scaleY(1)}}
.machine:has(#reels.settling) .skull-eye{fill:#ffd45c;animation:skull-glow .3s steps(2,end) infinite}
@keyframes skull-glow{0%{fill:#ffd45c}100%{fill:#ff8f3c}}
.screen{margin:0 4px;border:0;border-radius:0;background:#16221f;box-shadow:inset 0 0 0 3px #0b1210,0 0 0 3px #6d7f74}
.screen::after{height:4px;margin-top:6px;opacity:1;border-radius:0;background:repeating-linear-gradient(90deg,#f2bb55 0 4px,#233c38 4px 8px)}
.column-controls{padding:0 4px}
.status{padding-top:10px}
.lever::before{top:16px;left:14px;width:19px;height:153px;border:0;border-radius:0;background:linear-gradient(90deg,#55675c 0 4px,#7e9183 4px 9px,#9cae9b 9px 14px,#3f4d45 14px),repeating-linear-gradient(0deg,#2b3832 0 2px,transparent 2px 13px);box-shadow:0 0 0 3px #10191b,inset 0 3px #b6c6b0,inset 0 -3px #2b3832}
.lever-base{bottom:32px;left:3px;width:38px;height:36px;border:0;border-radius:0;background:#7f9086;box-shadow:0 0 0 3px #10191b,inset 0 3px #aebfae,inset 0 -4px #44534b,inset 3px 0 #95a59a,4px 4px #10191b,inset 5px 5px 0 -3px #ffffffb0,inset -5px -5px 0 -3px #2b3832}
.lever-arm{left:18px;width:13px;border:0;border-radius:0;background:linear-gradient(90deg,#2b3832 0 2px,#8fa094 2px 5px,#f4ecd2 5px 8px,#9aab9e 8px 11px,#44534b 11px);box-shadow:0 0 0 2px #10191b;transition:height .22s steps(4,end)}
.lever-ball{top:-13px;left:-10px;width:33px;height:33px;border:0;border-radius:0;background:#e0603a;clip-path:polygon(9px 0,24px 0,33px 9px,33px 24px,24px 33px,9px 33px,0 24px,0 9px);box-shadow:inset 0 0 0 3px #a33d2a,inset 7px 6px 0 -3px #ffd9a8,inset -9px -8px 0 -4px #7d2a1c,inset 0 -14px #c74c30}
.lever-ball::after{content:'';position:absolute;top:8px;left:7px;width:5px;height:5px;background:#fff3d6}
#lever.pulled .lever-ball{animation:lever-slam .3s steps(3,end)}
@keyframes lever-slam{0%{transform:translateY(-5px)}40%{transform:translateY(4px)}70%{transform:translateY(-2px)}100%{transform:none}}
.lever-label{bottom:3px;left:4px;padding:2px 4px;background:#10191b;color:#ffe6a8;font-size:8px;letter-spacing:1px}
/* 08e · 金币雨：金币三连时全屏像素金币坠落 */
.coin-rain{position:fixed;inset:0;z-index:900;overflow:hidden;pointer-events:none}
.coin-drop{position:absolute;top:-40px;width:26px;height:26px;animation:coin-fall linear forwards}

.header-right{display:flex;align-items:center;gap:12px}

.cell{background:#cfd6b4;border-bottom:0;transition:none}

.cell small{display:none}
.equipment{filter:none}
.cell.hit{background:#ffe9a2;box-shadow:inset 0 0 0 3px #dd6238,inset 0 0 0 5px #fff5da;animation:none}
.reels.has-win .cell:not(.hit){opacity:.38;filter:grayscale(.75)}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:30px}
.result-head{font-size:10px;letter-spacing:1px;color:var(--muted)}
.result-chips{display:inline-flex;flex-wrap:wrap;gap:5px}
.result-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 6px;font-size:10px;letter-spacing:1px;background:#fff5da;color:#1d2b2e;box-shadow:inset 0 0 0 2px #1d2b2e}
.result-chip.is-coin{background:#f5c838}
.result-chip svg{flex:none;width:14px;height:14px;filter:none;image-rendering:pixelated}
.result-gain{padding:3px 7px;font-size:10px;letter-spacing:1px;background:#2f8a7c;color:#fff5da;box-shadow:inset 0 0 0 2px #10191b}
/* 08g · 路面战场：--skyline 同时决定顶部背景带高度与布阵区起点，布阵格只会落在柏油路上 */
.scene{--skyline:120px;padding-top:var(--skyline);background:#26282a}
.scenery{top:0;bottom:auto;height:var(--skyline);z-index:-3}
/* 柏油路：路肩 → 车道边线 → 远端压暗 */
.scene::before{content:'';position:absolute;left:0;right:0;top:calc(var(--skyline) - 10px);bottom:0;z-index:-2;pointer-events:none;background:linear-gradient(90deg,transparent 0 2.4%,#cfc6ad1f 2.4% 3.1%,transparent 3.1% 96.9%,#cfc6ad1f 96.9% 97.6%,transparent 97.6%),radial-gradient(120% 44% at 78% 0,#ff7a2e1f,transparent 64%),repeating-linear-gradient(90deg,#ffffff05 0 2px,transparent 2px 6px),linear-gradient(180deg,#4b4336 0 4px,#6d6453 4px 6px,#15181a 6px 9px,#2a2c2e 9px 42%,#303335)}
/* 路面点缀：只留碎石与焦痕，密度刻意压低 */
.scene::after{content:'';position:absolute;left:0;right:0;top:var(--skyline);bottom:0;z-index:-1;pointer-events:none;opacity:.5;background-image:radial-gradient(#8c8477 1px,transparent 1px),radial-gradient(#6f685c 1px,transparent 1px),radial-gradient(#9a9183 1px,transparent 1px),radial-gradient(ellipse 40% 12% at 50% 96%,#0000005c,transparent 72%);background-size:118px 94px,173px 131px,211px 157px,100% 100%;background-position:17px 23px,71px 62px,133px 11px,center;background-repeat:repeat,repeat,repeat,no-repeat}
.field-badge{background:#101713d9;border-color:#6fae8a;color:#bfe3c9}
.empty p{color:#d8cdab}
.deployment-slot:empty::after{color:#9aa58c}
.side-banner{display:flex;align-items:center;gap:6px;margin:0 0 10px;padding:3px 5px;border:1px solid #11181a;box-shadow:2px 2px 0 #11181a66}
.side-banner svg{width:30px;height:20px;flex-shrink:0;display:block}
.ally-banner{background:linear-gradient(#1f3a2e,#16271f);border-left:4px solid #5f9c6e}
.enemy-banner{background:linear-gradient(#3a1d14,#271311);border-left:4px solid #c2501f}
.banner-count{font:700 11px monospace;letter-spacing:1px;color:#bfe3c9}
.banner-count b{font-size:13px;color:#f1e4b6}
.banner-spikes{flex:1;height:8px;background:repeating-linear-gradient(135deg,#8c3c22 0 3px,#2c1512 3px 7px);opacity:.85}
/* 布阵格=路面喷涂车位，按阵营分色；地台光取消，避免浮在空中 */
.deployment-slot{background:none}
.deployment-slot::before{left:6%;right:6%;bottom:4px;height:26px;transform:none;clip-path:none;border:1px dashed #cfc6ad4d;background:#ffffff08}
.ally-side .deployment-slot::before{border-color:#7fd4a370;background:#5fe0a312}
.enemy-grid .deployment-slot::before{border-color:#e0834f70;background:#e0602012}
.deployment-slot.drop-target::before{border-style:solid;border-color:#ffd979;background:#ffdb7930}
/* 中线=道路中央黄色虚线 */
.battlefield::after{border-left:0;width:5px;margin-left:-2.5px;top:34px;background:repeating-linear-gradient(#d8b23a 0 10px,transparent 10px 20px);opacity:.5}
/* 08l · 像素火焰：底宽顶尖的多层火苗 + 上飘火星 */
@keyframes fl-body{0%{transform:scaleY(1) translateY(0)}25%{transform:scaleY(1.14) translateY(-.4px)}50%{transform:scaleY(.93) translateY(0)}75%{transform:scaleY(1.07) translateY(-.8px)}100%{transform:scaleY(1) translateY(0)}}
@keyframes fl-tip{0%{opacity:1;transform:translate(0,0) scaleY(1)}30%{opacity:.45;transform:translate(.6px,-1.6px) scaleY(1.3)}60%{opacity:.95;transform:translate(-.6px,-.6px) scaleY(.8)}100%{opacity:1;transform:translate(0,0) scaleY(1)}}
@keyframes fl-spark{0%{opacity:0;transform:translate(0,0)}12%{opacity:1;transform:translate(0,-2px)}55%{opacity:.85;transform:translate(1px,-7px)}100%{opacity:0;transform:translate(-1px,-13px)}}
.flame-shell,.flame-mid,.flame-core,.flame-heart,.flame-tip,.flame-spark{transform-box:fill-box;transform-origin:50% 100%;will-change:transform}
.flame-shell{animation:fl-body .46s steps(3,end) infinite}
.flame-mid{animation:fl-body .34s steps(3,end) .07s infinite}
.flame-core{animation:fl-body .26s steps(2,end) .04s infinite}
.flame-heart{animation:fl-body .2s steps(2,end) .11s infinite}
.flame-tip{animation:fl-tip .5s steps(3,end) infinite}
.flame-spark{animation:fl-spark 1.3s steps(7,end) infinite}
/* 08h · 大满贯反馈 */
.result-chip.is-jackpot{background:#b9381b;color:#ffeec4;box-shadow:inset 0 0 0 2px #ffd979}
.status.jackpot{color:#7a2d16}
@keyframes jackpotFlash{0%,100%{box-shadow:inset 0 0 0 3px #ffd979}50%{box-shadow:inset 0 0 0 3px #ff7a2e}}
.reels.jackpot-flash{animation:jackpotFlash .32s steps(1,end) 8}
/* 08i · 各断点同步天际线带高度，保证布阵区永远落在路面上 */
@media(max-width:1100px){.scene{--skyline:104px}}
@media(max-width:860px){.scene{--skyline:88px}}
@media(max-width:760px) and (orientation:portrait){.scene{--skyline:74px}.side-banner{margin-bottom:3px;padding:1px 3px;gap:4px}.side-banner svg{width:22px;height:14px}.banner-count{font-size:9px}.banner-count b{font-size:11px}.deployment-slot::before{height:20px;bottom:3px}.battlefield::after{top:24px}}
@media(max-width:360px) and (orientation:portrait){.scene{--skyline:62px}}
@media(max-height:600px) and (orientation:landscape){.scene{--skyline:46px}.side-banner{margin-bottom:2px;padding:1px 3px;gap:4px}.side-banner svg{width:20px;height:13px}.banner-count{font-size:9px}.banner-count b{font-size:10px}.deployment-slot::before{height:16px;bottom:2px}.battlefield::after{top:20px}}
/* 08j · 透视路面：取代贴纸式平铺，用地平线 + 深度带 + 汇聚车道线做出纵深 */
.scene::before{display:none}
.scene::after{opacity:.2}
.ground{position:absolute;left:0;right:0;top:calc(var(--skyline) - 12px);bottom:-1px;z-index:-2;pointer-events:none;overflow:hidden}
.ground-plane{position:absolute;inset:0;display:block;width:100%;height:100%}
.ground::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 50% at 82% 0,#ff7a2e30,transparent 62%),radial-gradient(92% 42% at 13% 0,#ffb15a1f,transparent 58%),linear-gradient(180deg,#6b6150d9 0,#6b615000 10%),linear-gradient(180deg,transparent 58%,#0b0d0e4d 100%)}
/* 单位落地硬边阶梯投影，让站立感压在路面上 */
.combat-unit::before{content:'';position:absolute;left:50%;bottom:-3px;width:32px;height:10px;margin-left:-16px;z-index:-1;pointer-events:none;background:#0f131480;clip-path:polygon(22% 0,78% 0,100% 32%,100% 68%,78% 100%,22% 100%,0 68%,0 32%)}
.combat-unit.dead::before{opacity:.22}
/* 布阵格改成贴地透视梯形喷涂位 */
.deployment-slot::before{border:0;clip-path:polygon(13% 0,87% 0,100% 100%,0 100%);background:linear-gradient(180deg,#ffffff16,#ffffff05);box-shadow:inset 0 1px 0 #fff6d93d,inset 0 -2px 0 #0e121230}
.ally-side .deployment-slot::before{background:linear-gradient(180deg,#7fd4a333,#5fe0a30a);box-shadow:inset 0 1px 0 #a9efc85c,inset 0 -2px 0 #0e121238}
.enemy-side .deployment-slot::before{background:linear-gradient(180deg,#e0834f33,#e060200a);box-shadow:inset 0 1px 0 #ffb98e5c,inset 0 -2px 0 #0e121238}
.deployment-slot.drop-target::before{background:linear-gradient(180deg,#ffdb795c,#ffd9791a);box-shadow:inset 0 0 0 2px #ffd979,inset 0 -2px 0 #0e121238}
.battlefield::after{opacity:0}
/* 战场内不显示士兵名字，只保留徽记与血条 */
.battlefield .person-label,.combat-unit .combat-name{display:none}
.battlefield .person{grid-template-columns:minmax(0,1fr)}
/* 08j · 君王轮廓：扩大像素造型，脚底仍与其他怪物对齐 */
.combat-unit.zombie.alpha{width:88px;height:113px;margin-top:-113px}
.combat-unit.zombie.alpha .sprite{height:96.8px}
/* 08k · 中奖外包边：沿整条三连的外轮廓描框（行/列为矩形，斜线为阶梯带） */
.win-frames{position:absolute;inset:0;z-index:6;overflow:visible;pointer-events:none;opacity:0;transition:opacity .1s linear}
.screen:has(.has-win) .win-frames{opacity:1}
.wf-glow{fill:none;stroke:#ff8a33;stroke-width:9;stroke-linejoin:miter;opacity:.24}
.wf-box{fill:none;stroke:#ffd24a;stroke-width:4;stroke-linejoin:miter;animation:wf-blink .34s steps(2,end) infinite}
.wf-dash{fill:none;stroke:#fff6d0;stroke-width:2;stroke-linejoin:miter;stroke-dasharray:7 6;animation:wf-march .55s linear infinite}
.wf-pip{fill:#fff6d0;animation:wf-blink .34s steps(2,end) infinite}
@keyframes wf-blink{0%,100%{opacity:1}50%{opacity:.26}}
@keyframes wf-march{to{stroke-dashoffset:-26}}
.reels.has-win .cell:not(.hit){opacity:.3;filter:grayscale(.8) brightness(.8)}
/* 09 · 无动画偏好始终最后，覆盖全部反馈 */
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.reel.spinning .cell{filter:none}.wf-dash{stroke-dasharray:none;opacity:.85}.wf-box{opacity:1}.flame-tip,.flame-spark{opacity:.9}.combat-result b{opacity:1;transform:none}}
</style>
</head>

    missedSpins=reward.count?0:missedSpins+1;
    await showBoardResult(board,reward);
  } catch(error) {
    if(run===epoch){
      if(refundable){balance+=recruitCost;currentBoard=null;claimedRewards.clear();}
      $('status').textContent=refundable?'招募未完成，200金币已退回。':'奖励已结算，展示异常；不会重复退款。';console.error(error);
    }
  } finally {
    if(run===epoch){cancelReels();cancelTimers();finishOperation();}
  }
}
const lever=$('lever');let gesture=null,suppressClickUntil=0;
function cancelGesture() {
  const old=gesture;gesture=null;lever.classList.remove('dragging','pulled');lever.style.removeProperty('--pull');
  if(old&&lever.hasPointerCapture(old.id))lever.releasePointerCapture(old.id);
}

}

lever.addEventListener('pointerdown',event=>{
  if(lever.disabled||!event.isPrimary||event.button!==0)return;
  unlockAudio();gesture={id:event.pointerId,y:event.clientY,distance:0,travel:0};lever.classList.add('dragging');lever.setPointerCapture(event.pointerId);
});
lever.addEventListener('pointermove',event=>{if(!gesture||event.pointerId!==gesture.id)return;gesture.travel=Math.max(gesture.travel,Math.abs(event.clientY-gesture.y));gesture.distance=Math.max(0,event.clientY-gesture.y);lever.style.setProperty('--pull',Math.min(98,gesture.distance)+'px');});
function releaseLever(event,cancelled) {
  if(!gesture||event.pointerId!==gesture.id)return;
  const distance=gesture.distance,travel=gesture.travel;cancelGesture();
  if(cancelled||travel>8)suppressClickUntil=performance.now()+400;
  if(!cancelled&&distance>=35)spin();
}
lever.addEventListener('pointerup',event=>releaseLever(event,false));lever.addEventListener('pointercancel',event=>releaseLever(event,true));lever.addEventListener('lostpointercapture',event=>releaseLever(event,true));
lever.addEventListener('click',event=>{if(event.detail===0||performance.now()>=suppressClickUntil)spin();});
document.addEventListener('keydown',event=>{

});
